<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 / 회원가입 - 비바샵</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--surface-2:#252525;
  --border:rgba(255,255,255,0.08);--primary:#6366f1;--primary-h:#818cf8;
  --success:#22c55e;--danger:#ef4444;--text:#f1f5f9;--muted:#94a3b8;--radius:14px;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;}

/* Nav */
.nav{display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:60px;border-bottom:1px solid var(--border);
  background:rgba(15,15,15,0.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100;}
.nav-logo{font-size:1.2rem;font-weight:700;color:var(--text);text-decoration:none;}

/* Main */
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:40px;width:100%;max-width:420px;}
.card-title{font-size:1.5rem;font-weight:700;margin-bottom:8px;}
.card-sub{color:var(--muted);font-size:.9rem;margin-bottom:28px;}

/* Tabs */
.tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:10px;
  padding:4px;margin-bottom:28px;}
.tab{flex:1;padding:9px;border:none;border-radius:8px;cursor:pointer;
  font-size:.9rem;font-weight:600;transition:all .2s;
  background:transparent;color:var(--muted);}
.tab.active{background:var(--primary);color:#fff;}

/* Form */
.form-group{margin-bottom:18px;}
label{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:7px;}
input{width:100%;padding:11px 14px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-size:.95rem;outline:none;
  transition:border-color .2s;}
input:focus{border-color:var(--primary);}
input::placeholder{color:#4b5563;}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-size:.95rem;
  font-weight:700;cursor:pointer;transition:all .15s;margin-top:4px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-h);transform:translateY(-1px);}
.btn-primary:active{transform:translateY(0);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;}

.msg{padding:12px 14px;border-radius:10px;font-size:.875rem;margin-bottom:16px;display:none;}
.msg.error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5;}
.msg.success{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#86efac;}
.msg.show{display:block;}

.divider{text-align:center;color:var(--muted);font-size:.8rem;margin:20px 0;position:relative;}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:var(--border);}
.divider::before{left:0;}.divider::after{right:0;}
</style>
</head>
<body>
<nav class="nav">
  <a href="index.html" class="nav-logo">🎁 비바샵</a>
</nav>
<main>
  <div class="card">
    <div class="card-title">환영합니다 👋</div>
    <div class="card-sub">굿즈를 구경하고 구매해 보세요.</div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">로그인</button>
      <button class="tab" onclick="switchTab('signup')">회원가입</button>
    </div>

    <div id="msg" class="msg"></div>

    <!-- 로그인 폼 -->
    <div id="loginForm">
      <div class="form-group">
        <label>이메일</label>
        <input type="email" id="loginEmail" placeholder="example@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" id="loginPw" placeholder="비밀번호 입력" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" id="loginBtn" onclick="login()">로그인</button>
    </div>

    <!-- 회원가입 폼 -->
    <div id="signupForm" style="display:none;">
      <div class="form-group">
        <label>이메일</label>
        <input type="email" id="signupEmail" placeholder="example@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>비밀번호 (6자 이상)</label>
        <input type="password" id="signupPw" placeholder="비밀번호 입력" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>비밀번호 확인</label>
        <input type="password" id="signupPw2" placeholder="비밀번호 재입력" autocomplete="new-password">
      </div>
      <button class="btn btn-primary" id="signupBtn" onclick="signup()">회원가입</button>
    </div>
  </div>
</main>

<script>
const SUPABASE_URL = 'https://bnkibfbpzdbccnqrysub.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJua2liZmJwemRiY2NucXJ5c3ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNjMyMDcsImV4cCI6MjA5MzgzOTIwN30.PVOTXsJjfv7L5dxRCqaYy6l_BvIan-FUFmaShWiN2i0';
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 이미 로그인된 경우 리다이렉트
(async () => {
  const { data: { session } } = await client.auth.getSession();
  if (session) location.href = 'index.html';
})();

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0) === (tab === 'login'));
  });
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
  showMsg('', '');
}

function showMsg(type, text) {
  const el = document.getElementById('msg');
  el.className = 'msg' + (type ? ` ${type} show` : '');
  el.textContent = text;
}

function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  btn.textContent = loading ? '처리 중...' : (btnId === 'loginBtn' ? '로그인' : '회원가입');
}

async function login() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPw').value;
  if (!email || !password) return showMsg('error', '이메일과 비밀번호를 입력해 주세요.');
  setLoading('loginBtn', true);
  const { error } = await client.auth.signInWithPassword({ email, password });
  if (error) {
    showMsg('error', '로그인 실패: ' + (error.message === 'Invalid login credentials' ? '이메일 또는 비밀번호가 틀렸습니다.' : error.message));
    setLoading('loginBtn', false);
  } else {
    showMsg('success', '로그인 성공! 이동 중...');
    setTimeout(() => location.href = 'index.html', 800);
  }
}

async function signup() {
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPw').value;
  const password2 = document.getElementById('signupPw2').value;
  if (!email || !password) return showMsg('error', '모든 항목을 입력해 주세요.');
  if (password.length < 6) return showMsg('error', '비밀번호는 6자 이상이어야 합니다.');
  if (password !== password2) return showMsg('error', '비밀번호가 일치하지 않습니다.');
  setLoading('signupBtn', true);
  const { error } = await client.auth.signUp({ email, password });
  if (error) {
    showMsg('error', '회원가입 실패: ' + error.message);
    setLoading('signupBtn', false);
  } else {
    showMsg('success', '회원가입 완료! 로그인 중...');
    setTimeout(() => location.href = 'index.html', 1000);
  }
}

// Enter 키 지원
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const isLogin = document.getElementById('loginForm').style.display !== 'none';
    isLogin ? login() : signup();
  }
});
</script>
</body>
</html>
