<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결제 실패 - 비바샵</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--surface-2:#252525;
  --border:rgba(255,255,255,0.08);--primary:#6366f1;--primary-h:#818cf8;
  --danger:#ef4444;--text:#f1f5f9;--muted:#94a3b8;--radius:14px;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;}
.nav{display:flex;align-items:center;padding:0 24px;height:60px;
  border-bottom:1px solid var(--border);background:rgba(15,15,15,.9);backdrop-filter:blur(10px);}
.nav-logo{font-size:1.2rem;font-weight:700;color:var(--text);text-decoration:none;}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:48px 40px;width:100%;max-width:440px;text-align:center;}
.icon{font-size:3.5rem;margin-bottom:20px;display:block;}
.title{font-size:1.5rem;font-weight:700;color:var(--danger);margin-bottom:10px;}
.sub{color:var(--muted);margin-bottom:12px;line-height:1.6;}
.error-box{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);
  border-radius:10px;padding:14px;margin:20px 0 28px;font-size:.85rem;color:#fca5a5;word-break:break-word;}
.btns{display:flex;gap:12px;}
.btn{flex:1;padding:13px;border:none;border-radius:10px;font-size:.9rem;font-weight:600;
  cursor:pointer;transition:all .15s;text-decoration:none;
  display:flex;align-items:center;justify-content:center;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-h);}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-outline:hover{background:var(--surface-2);}
</style>
</head>
<body>
<nav class="nav">
  <a href="index.html" class="nav-logo">🎁 비바샵</a>
</nav>
<main>
  <div class="card">
    <span class="icon">❌</span>
    <div class="title">결제에 실패했습니다</div>
    <div class="sub">아래 오류 내용을 확인하시고 다시 시도해 주세요.</div>
    <div class="error-box" id="errBox">알 수 없는 오류</div>
    <div class="btns">
      <a href="index.html" class="btn btn-primary">다시 시도</a>
      <a href="index.html" class="btn btn-outline">홈으로</a>
    </div>
  </div>
</main>
<script>
const params = new URLSearchParams(location.search);
const code = params.get('code') || '';
const msg = params.get('message') || '결제가 취소되었거나 오류가 발생했습니다.';
document.getElementById('errBox').textContent =
  (code ? '[' + code + '] ' : '') + decodeURIComponent(msg);
</script>
</body>
</html>
