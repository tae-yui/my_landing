<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비바샵 - 굿즈 쇼핑몰</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://js.tosspayments.com/v2/standard"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--surface-2:#252525;
  --border:rgba(255,255,255,0.08);--primary:#6366f1;--primary-h:#818cf8;
  --success:#22c55e;--success-h:#16a34a;--danger:#ef4444;
  --text:#f1f5f9;--muted:#94a3b8;--radius:14px;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}

/* ── Nav ── */
.nav{display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:60px;border-bottom:1px solid var(--border);
  background:rgba(15,15,15,.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:200;}
.nav-logo{font-size:1.2rem;font-weight:700;color:var(--text);text-decoration:none;}
.nav-right{display:flex;align-items:center;gap:10px;}
.nav-email{font-size:.8rem;color:var(--muted);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.btn-sm{padding:7px 14px;border:none;border-radius:8px;font-size:.8rem;font-weight:600;
  cursor:pointer;transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:5px;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-ghost:hover{color:var(--text);border-color:rgba(255,255,255,.2);}
.btn-primary-sm{background:var(--primary);color:#fff;}
.btn-primary-sm:hover{background:var(--primary-h);}
.cart-btn{position:relative;}
.cart-badge{position:absolute;top:-7px;right:-7px;background:var(--danger);color:#fff;
  width:18px;height:18px;border-radius:50%;font-size:.65rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;display:none;}

/* ── Hero ── */
.hero{padding:60px 24px;text-align:center;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 60% at 50% -10%,rgba(99,102,241,.25),transparent);
  pointer-events:none;}
.hero-tag{display:inline-block;padding:5px 14px;border-radius:100px;
  background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.3);
  color:var(--primary-h);font-size:.8rem;font-weight:600;margin-bottom:20px;}
.hero h1{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;margin-bottom:12px;line-height:1.2;}
.hero p{color:var(--muted);font-size:1rem;max-width:440px;margin:0 auto;}

/* ── Products ── */
.section{max-width:960px;margin:0 auto;padding:0 24px 60px;}
.section-title{font-size:1.1rem;font-weight:700;margin-bottom:20px;
  display:flex;align-items:center;gap:8px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;}

/* Product card */
.product-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;transition:transform .2s,border-color .2s;}
.product-card:hover{transform:translateY(-4px);border-color:rgba(99,102,241,.4);}
.product-img{height:160px;display:flex;align-items:center;justify-content:center;
  font-size:4rem;background:var(--surface-2);position:relative;}
.stock-out{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;
  justify-content:center;font-size:.85rem;font-weight:600;color:var(--muted);}
.product-body{padding:16px;}
.product-name{font-weight:700;font-size:.95rem;margin-bottom:6px;}
.product-desc{font-size:.8rem;color:var(--muted);margin-bottom:14px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.product-price{font-size:1.1rem;font-weight:700;margin-bottom:12px;color:var(--text);}
.btn-cart{width:100%;padding:10px;border:none;border-radius:9px;font-size:.85rem;font-weight:600;
  cursor:pointer;transition:all .15s;background:var(--success);color:#fff;}
.btn-cart:hover{background:var(--success-h);}
.btn-cart:active{transform:scale(.97);}
.btn-cart:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed;}
.btn-cart.added{background:rgba(34,197,94,.2);color:var(--success);border:1px solid rgba(34,197,94,.3);}

/* ── Cart Overlay ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none;
  backdrop-filter:blur(3px);}
.overlay.open{display:block;}

/* Cart Panel */
.cart-panel{position:fixed;right:0;top:0;bottom:0;width:min(400px,100vw);
  background:var(--surface);border-left:1px solid var(--border);z-index:400;
  display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;}
.cart-panel.open{transform:translateX(0);}
.cart-header{display:flex;align-items:center;justify-content:space-between;
  padding:20px 20px 16px;border-bottom:1px solid var(--border);}
.cart-title{font-size:1.05rem;font-weight:700;}
.cart-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.3rem;
  padding:4px;line-height:1;}
.cart-close:hover{color:var(--text);}
.cart-body{flex:1;overflow-y:auto;padding:16px 20px;}
.cart-empty{text-align:center;padding:60px 0;color:var(--muted);}
.cart-empty-icon{font-size:2.5rem;display:block;margin-bottom:12px;}
.cart-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.cart-item:last-child{border:none;}
.cart-emoji{font-size:2rem;width:48px;text-align:center;flex-shrink:0;}
.cart-info{flex:1;min-width:0;}
.cart-name{font-size:.875rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cart-unit{font-size:.75rem;color:var(--muted);margin-top:2px;}
.qty-ctrl{display:flex;align-items:center;gap:6px;margin-top:6px;}
.qty-btn{width:24px;height:24px;border:1px solid var(--border);border-radius:6px;
  background:var(--surface-2);color:var(--text);cursor:pointer;font-size:.85rem;
  display:flex;align-items:center;justify-content:center;transition:background .15s;}
.qty-btn:hover{background:var(--surface-2);border-color:rgba(255,255,255,.2);}
.qty-num{width:28px;text-align:center;font-size:.875rem;font-weight:600;}
.cart-item-price{font-weight:600;font-size:.875rem;flex-shrink:0;}
.cart-del{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;
  font-size:.85rem;margin-left:4px;}
.cart-del:hover{color:var(--danger);}
.cart-footer{padding:16px 20px;border-top:1px solid var(--border);}
.cart-summary{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.cart-total-label{color:var(--muted);font-size:.875rem;}
.cart-total-amt{font-size:1.2rem;font-weight:700;color:var(--success);}
.btn-checkout{width:100%;padding:14px;border:none;border-radius:10px;font-size:.95rem;
  font-weight:700;cursor:pointer;transition:all .15s;background:var(--success);color:#fff;}
.btn-checkout:hover{background:var(--success-h);}
.btn-checkout:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed;}

/* Spinner */
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);
  border-radius:50%;animation:spin .8s linear infinite;margin:60px auto;}
@keyframes spin{to{transform:rotate(360deg)}}

/* reveal */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .5s ease,transform .5s ease;}
.reveal.visible{opacity:1;transform:none;}

@media(max-width:600px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;}
  .product-img{height:130px;font-size:3rem;}
  .hero{padding:40px 16px;}
  .section{padding:0 16px 40px;}
  .nav-email{display:none;}
}
</style>
</head>
<body>
<!-- Nav -->
<nav class="nav">
  <a href="index.html" class="nav-logo">🎁 비바샵</a>
  <div class="nav-right">
    <span class="nav-email" id="navEmail"></span>
    <div id="authArea">
      <!-- 동적으로 채워짐 -->
    </div>
    <button class="btn-sm btn-ghost cart-btn" onclick="toggleCart()" id="cartBtn">
      🛒 장바구니
      <span class="cart-badge" id="cartBadge">0</span>
    </button>
  </div>
</nav>

<!-- Cart Overlay -->
<div class="overlay" id="overlay" onclick="toggleCart()"></div>

<!-- Cart Panel -->
<div class="cart-panel" id="cartPanel">
  <div class="cart-header">
    <span class="cart-title">🛒 장바구니</span>
    <button class="cart-close" onclick="toggleCart()">✕</button>
  </div>
  <div class="cart-body" id="cartBody"></div>
  <div class="cart-footer">
    <div class="cart-summary">
      <span class="cart-total-label">총 결제금액</span>
      <span class="cart-total-amt" id="cartTotal">0원</span>
    </div>
    <button class="btn-checkout" id="checkoutBtn" onclick="checkout()">결제하기</button>
  </div>
</div>

<!-- Hero -->
<div class="hero">
  <div class="hero-tag">✨ 공식 굿즈</div>
  <h1>특별한 굿즈를<br>만나보세요</h1>
  <p>정성껏 만든 굿즈들을 합리적인 가격에 만나볼 수 있어요.</p>
</div>

<!-- Products -->
<section class="section">
  <div class="section-title">🏪 전체 상품</div>
  <div id="productGrid"><div class="spinner"></div></div>
</section>

<script>
const SUPABASE_URL = 'https://bnkibfbpzdbccnqrysub.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJua2liZmJwemRiY2NucXJ5c3ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNjMyMDcsImV4cCI6MjA5MzgzOTIwN30.PVOTXsJjfv7L5dxRCqaYy6l_BvIan-FUFmaShWiN2i0';
const TOSS_CLIENT_KEY = 'YOUR_TOSS_CLIENT_KEY'; // ← 발급받은 test_ck_... 키로 교체하세요
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let session = null;
let cart = JSON.parse(localStorage.getItem('vibeshop_cart') || '[]');

function fmt(n) { return n.toLocaleString('ko-KR') + '원'; }

// ── Auth state ──
async function initAuth() {
  const { data: { session: s } } = await client.auth.getSession();
  session = s;
  const area = document.getElementById('authArea');
  if (session) {
    document.getElementById('navEmail').textContent = session.user.email;
    let links = `<a href="orders.html" class="btn-sm btn-ghost">내 주문</a>`;
    if (session.user.email === 'admin@admin.com')
      links += `<a href="admin.html" class="btn-sm btn-ghost">관리자</a>`;
    links += `<button class="btn-sm btn-ghost" onclick="logout()">로그아웃</button>`;
    area.innerHTML = links;
  } else {
    area.innerHTML = `<a href="auth.html" class="btn-sm btn-primary-sm">로그인</a>`;
  }
}

async function logout() {
  await client.auth.signOut();
  session = null;
  location.reload();
}

// ── Products ──
async function loadProducts() {
  const { data: products, error } = await client.from('products').select('*').order('created_at');
  const grid = document.getElementById('productGrid');
  if (error || !products) {
    grid.innerHTML = '<p style="color:var(--muted);text-align:center">상품을 불러오는 데 실패했습니다.</p>';
    return;
  }
  if (products.length === 0) {
    grid.innerHTML = '<p style="color:var(--muted);text-align:center">등록된 상품이 없습니다.</p>';
    return;
  }
  grid.className = 'grid';
  grid.innerHTML = products.map(p => `
    <div class="product-card reveal" data-id="${p.id}">
      <div class="product-img">
        ${p.image_emoji || '🎁'}
        ${p.stock <= 0 ? '<div class="stock-out">품절</div>' : ''}
      </div>
      <div class="product-body">
        <div class="product-name">${p.name}</div>
        <div class="product-desc">${p.description || ''}</div>
        <div class="product-price">${fmt(p.price)}</div>
        <button class="btn-cart" id="cart-${p.id}"
          onclick="addToCart('${p.id}','${p.name}',${p.price},'${p.image_emoji || '🎁'}')"
          ${p.stock <= 0 ? 'disabled' : ''}>
          ${p.stock <= 0 ? '품절' : '장바구니 담기'}
        </button>
      </div>
    </div>
  `).join('');

  // 스크롤 애니메이션
  const obs = new IntersectionObserver(
    entries => entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); }),
    { threshold: 0.08 }
  );
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
}

// ── Cart ──
function saveCart() { localStorage.setItem('vibeshop_cart', JSON.stringify(cart)); }

function addToCart(id, name, price, emoji) {
  const idx = cart.findIndex(i => i.id === id);
  if (idx >= 0) cart[idx].qty += 1;
  else cart.push({ id, name, price, emoji, qty: 1 });
  saveCart();
  updateCartUI();

  // 버튼 피드백
  const btn = document.getElementById('cart-' + id);
  if (btn) {
    const orig = btn.textContent;
    btn.textContent = '✓ 담겼어요!';
    btn.classList.add('added');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('added'); }, 1200);
  }
}

function updateQty(id, delta) {
  const idx = cart.findIndex(i => i.id === id);
  if (idx < 0) return;
  cart[idx].qty = Math.max(1, cart[idx].qty + delta);
  saveCart();
  renderCart();
  updateCartUI();
}

function removeItem(id) {
  cart = cart.filter(i => i.id !== id);
  saveCart();
  renderCart();
  updateCartUI();
}

function updateCartUI() {
  const count = cart.reduce((s, i) => s + i.qty, 0);
  const badge = document.getElementById('cartBadge');
  badge.style.display = count > 0 ? 'flex' : 'none';
  badge.textContent = count;
}

function renderCart() {
  const body = document.getElementById('cartBody');
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  document.getElementById('cartTotal').textContent = fmt(total);
  document.getElementById('checkoutBtn').disabled = cart.length === 0;

  if (cart.length === 0) {
    body.innerHTML = `<div class="cart-empty">
      <span class="cart-empty-icon">🛒</span>
      장바구니가 비어있어요.<br>상품을 담아보세요!
    </div>`;
    return;
  }

  body.innerHTML = cart.map(i => `
    <div class="cart-item">
      <span class="cart-emoji">${i.emoji}</span>
      <div class="cart-info">
        <div class="cart-name">${i.name}</div>
        <div class="cart-unit">${fmt(i.price)}</div>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="updateQty('${i.id}',-1)">−</button>
          <span class="qty-num">${i.qty}</span>
          <button class="qty-btn" onclick="updateQty('${i.id}',1)">+</button>
        </div>
      </div>
      <span class="cart-item-price">${fmt(i.price * i.qty)}</span>
      <button class="cart-del" onclick="removeItem('${i.id}')" title="삭제">✕</button>
    </div>
  `).join('');
}

function toggleCart() {
  const panel = document.getElementById('cartPanel');
  const overlay = document.getElementById('overlay');
  const isOpen = panel.classList.toggle('open');
  overlay.classList.toggle('open', isOpen);
  if (isOpen) renderCart();
}

// ── Checkout ──
async function checkout() {
  if (cart.length === 0) return;
  if (!session) { location.href = 'auth.html'; return; }

  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const orderId = crypto.randomUUID().replace(/-/g, '').slice(0, 32);
  const orderName = cart.length === 1
    ? `${cart[0].name} × ${cart[0].qty}`
    : `${cart[0].name} 외 ${cart.length - 1}건`;

  // 결제 완료 후 confirm-payment에 넘길 cart 저장
  sessionStorage.setItem('vibeshop_pending_cart', JSON.stringify(cart));

  const shopBase = window.location.href.split('?')[0].replace(/[^/]*$/, '');

  try {
    const tossPayments = TossPayments(TOSS_CLIENT_KEY);
    const payment = tossPayments.payment({ customerKey: session.user.id });
    await payment.requestPayment({
      method: 'CARD',
      amount: { currency: 'KRW', value: total },
      orderId,
      orderName,
      successUrl: shopBase + 'success.html',
      failUrl: shopBase + 'fail.html',
      customerEmail: session.user.email,
      customerName: session.user.email.split('@')[0],
    });
  } catch (err) {
    if (err.code !== 'USER_CANCEL') {
      alert('결제 오류: ' + (err.message || err));
    }
  }
}

// ── Init ──
(async () => {
  await initAuth();
  await loadProducts();
  updateCartUI();
})();
</script>
</body>
</html>
