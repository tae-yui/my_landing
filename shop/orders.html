<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 주문 내역 - 비바샵</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--surface-2:#252525;
  --border:rgba(255,255,255,0.08);--primary:#6366f1;--primary-h:#818cf8;
  --success:#22c55e;--danger:#ef4444;--text:#f1f5f9;--muted:#94a3b8;--radius:14px;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}

/* Nav */
.nav{display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:60px;border-bottom:1px solid var(--border);
  background:rgba(15,15,15,.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100;}
.nav-logo{font-size:1.2rem;font-weight:700;color:var(--text);text-decoration:none;}
.nav-right{display:flex;align-items:center;gap:12px;}
.nav-email{font-size:.85rem;color:var(--muted);}
.btn-sm{padding:7px 14px;border:none;border-radius:8px;font-size:.8rem;font-weight:600;
  cursor:pointer;transition:all .15s;text-decoration:none;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-ghost:hover{color:var(--text);border-color:rgba(255,255,255,.2);}
.btn-primary-sm{background:var(--primary);color:#fff;}
.btn-primary-sm:hover{background:var(--primary-h);}

/* Main */
main{max-width:720px;margin:0 auto;padding:40px 24px;}
.page-title{font-size:1.5rem;font-weight:700;margin-bottom:28px;}

/* Order cards */
.order-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px;margin-bottom:16px;}
.order-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.order-date{font-size:.8rem;color:var(--muted);}
.badge{padding:4px 10px;border-radius:100px;font-size:.75rem;font-weight:600;}
.badge-paid{background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.25);}
.badge-failed{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.25);}
.order-items{border-top:1px solid var(--border);padding-top:14px;}
.order-item{display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;font-size:.9rem;}
.order-item-name{display:flex;align-items:center;gap:8px;}
.order-item-price{color:var(--muted);}
.order-total{display:flex;justify-content:space-between;
  padding-top:12px;border-top:1px solid var(--border);margin-top:4px;
  font-weight:700;font-size:1rem;}
.order-total-amt{color:var(--success);}

.empty{text-align:center;padding:80px 24px;color:var(--muted);}
.empty-icon{font-size:3rem;display:block;margin-bottom:16px;}
.empty-text{font-size:1rem;margin-bottom:20px;}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);
  border-radius:50%;animation:spin .8s linear infinite;margin:60px auto;}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:600px){
  .order-header{flex-direction:column;align-items:flex-start;gap:8px;}
  main{padding:24px 16px;}
}
</style>
</head>
<body>
<nav class="nav">
  <a href="index.html" class="nav-logo">🎁 비바샵</a>
  <div class="nav-right">
    <span class="nav-email" id="navEmail"></span>
    <a href="index.html" class="btn-sm btn-ghost">쇼핑하기</a>
    <button class="btn-sm btn-ghost" onclick="logout()">로그아웃</button>
  </div>
</nav>
<main>
  <div class="page-title">내 주문 내역</div>
  <div id="content"><div class="spinner"></div></div>
</main>

<script>
const SUPABASE_URL = 'https://bnkibfbpzdbccnqrysub.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJua2liZmJwemRiY2NucXJ5c3ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNjMyMDcsImV4cCI6MjA5MzgzOTIwN30.PVOTXsJjfv7L5dxRCqaYy6l_BvIan-FUFmaShWiN2i0';
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function fmt(n) { return n.toLocaleString('ko-KR') + '원'; }
function fmtDate(s) {
  return new Date(s).toLocaleString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit' });
}

async function logout() {
  await client.auth.signOut();
  location.href = 'auth.html';
}

(async () => {
  const { data: { session } } = await client.auth.getSession();
  if (!session) { location.href = 'auth.html'; return; }

  document.getElementById('navEmail').textContent = session.user.email;

  const { data: orders, error } = await client
    .from('orders')
    .select('*, order_items(quantity, unit_price, products(name, image_emoji))')
    .order('created_at', { ascending: false });

  const el = document.getElementById('content');

  if (error) {
    el.innerHTML = '<div class="empty"><span class="empty-icon">⚠️</span><div class="empty-text">오류: ' + error.message + '</div></div>';
    return;
  }

  if (!orders || orders.length === 0) {
    el.innerHTML = `<div class="empty">
      <span class="empty-icon">📦</span>
      <div class="empty-text">아직 주문 내역이 없어요.</div>
      <a href="index.html" style="display:inline-block;padding:11px 24px;background:var(--primary);
        color:#fff;border-radius:10px;text-decoration:none;font-weight:600;">쇼핑하러 가기</a>
    </div>`;
    return;
  }

  el.innerHTML = orders.map(order => {
    const badge = order.status === 'paid'
      ? '<span class="badge badge-paid">결제 완료</span>'
      : '<span class="badge badge-failed">결제 실패</span>';
    const items = (order.order_items || []).map(i =>
      `<div class="order-item">
        <span class="order-item-name">${i.products?.image_emoji || '🎁'} ${i.products?.name || '상품'} × ${i.quantity}</span>
        <span class="order-item-price">${fmt(i.unit_price * i.quantity)}</span>
      </div>`
    ).join('');
    return `<div class="order-card">
      <div class="order-header">
        <span class="order-date">${fmtDate(order.created_at)}</span>
        ${badge}
      </div>
      <div class="order-items">
        ${items}
        <div class="order-total">
          <span>총 결제금액</span>
          <span class="order-total-amt">${fmt(order.amount)}</span>
        </div>
      </div>
    </div>`;
  }).join('');
})();
</script>
</body>
</html>
