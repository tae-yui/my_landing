<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 페이지 - 비바샵</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--surface-2:#252525;
  --border:rgba(255,255,255,0.08);--primary:#6366f1;--primary-h:#818cf8;
  --success:#22c55e;--danger:#ef4444;--text:#f1f5f9;--muted:#94a3b8;--radius:14px;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}
.nav{display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:60px;border-bottom:1px solid var(--border);
  background:rgba(15,15,15,.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100;}
.nav-logo{font-size:1.2rem;font-weight:700;color:var(--text);text-decoration:none;}
.nav-badge{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.25);
  padding:3px 10px;border-radius:100px;font-size:.75rem;font-weight:600;margin-left:8px;}
.nav-right{display:flex;align-items:center;gap:12px;}
.btn-sm{padding:7px 14px;border:none;border-radius:8px;font-size:.8rem;font-weight:600;
  cursor:pointer;transition:all .15s;background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-sm:hover{color:var(--text);}

main{max-width:960px;margin:0 auto;padding:40px 24px;}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;}
.page-title{font-size:1.5rem;font-weight:700;}
.page-sub{color:var(--muted);font-size:.85rem;margin-top:4px;}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:32px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
.stat-label{font-size:.8rem;color:var(--muted);margin-bottom:8px;}
.stat-value{font-size:1.6rem;font-weight:700;}
.stat-value.green{color:var(--success);}
.stat-value.purple{color:var(--primary);}

/* Table */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.table-head{padding:16px 20px;border-bottom:1px solid var(--border);
  font-size:.8rem;color:var(--muted);font-weight:600;}
table{width:100%;border-collapse:collapse;font-size:.875rem;}
th{padding:12px 16px;text-align:left;font-size:.75rem;color:var(--muted);
  font-weight:600;border-bottom:1px solid var(--border);background:var(--surface-2);}
td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:top;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.02);}
.badge{padding:3px 9px;border-radius:100px;font-size:.72rem;font-weight:600;}
.badge-paid{background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.2);}
.badge-failed{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.2);}
.user-email{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:.8rem;}
.items-list{font-size:.8rem;color:var(--muted);margin-top:3px;}
.amt{font-weight:600;color:var(--success);}

.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);
  border-radius:50%;animation:spin .8s linear infinite;margin:60px auto;}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:700px){
  .stats{grid-template-columns:1fr 1fr;}
  table{font-size:.8rem;}
  th,td{padding:10px 12px;}
  .user-email{max-width:120px;}
  main{padding:24px 12px;}
}
</style>
</head>
<body>
<nav class="nav">
  <div style="display:flex;align-items:center;">
    <a href="index.html" class="nav-logo">🎁 비바샵</a>
    <span class="nav-badge">관리자</span>
  </div>
  <div class="nav-right">
    <span style="font-size:.8rem;color:var(--muted);" id="navEmail"></span>
    <button class="btn-sm" onclick="logout()">로그아웃</button>
  </div>
</nav>
<main>
  <div class="page-header">
    <div>
      <div class="page-title">전체 주문 관리</div>
      <div class="page-sub" id="lastUpdated"></div>
    </div>
  </div>

  <div class="stats" id="stats">
    <div class="stat-card"><div class="stat-label">전체 주문 수</div><div class="stat-value purple" id="statOrders">-</div></div>
    <div class="stat-card"><div class="stat-label">총 매출</div><div class="stat-value green" id="statRevenue">-</div></div>
    <div class="stat-card"><div class="stat-label">오늘 주문</div><div class="stat-value" id="statToday">-</div></div>
  </div>

  <div class="table-wrap" id="tableWrap">
    <div class="spinner"></div>
  </div>
</main>

<script>
const SUPABASE_URL = 'https://bnkibfbpzdbccnqrysub.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJua2liZmJwemRiY2NucXJ5c3ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNjMyMDcsImV4cCI6MjA5MzgzOTIwN30.PVOTXsJjfv7L5dxRCqaYy6l_BvIan-FUFmaShWiN2i0';
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const ADMIN_EMAIL = 'admin@admin.com';

function fmt(n) { return n.toLocaleString('ko-KR') + '원'; }
function fmtDate(s) {
  return new Date(s).toLocaleString('ko-KR', {
    year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'
  });
}

async function logout() {
  await client.auth.signOut();
  location.href = 'auth.html';
}

(async () => {
  const { data: { session } } = await client.auth.getSession();
  if (!session) { location.href = 'auth.html'; return; }
  if (session.user.email !== ADMIN_EMAIL) { location.href = 'index.html'; return; }

  document.getElementById('navEmail').textContent = session.user.email;

  // 주문 + 사용자 + 상품 정보 조회
  const { data: orders, error } = await client
    .from('orders')
    .select(`
      id, user_id, amount, status, created_at, toss_order_id,
      order_items (quantity, unit_price, products (name, image_emoji))
    `)
    .order('created_at', { ascending: false });

  const wrap = document.getElementById('tableWrap');

  if (error) {
    wrap.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted);">오류: ' + error.message + '</div>';
    return;
  }

  // 사용자 이메일 조회 (별도 요청 - user_id로 매핑)
  // Supabase RLS 상에서 admin은 모든 orders 조회 가능
  // user 이메일은 auth.users에 있어서 직접 조회 불가 → toss_order_id 표시로 대체
  // (실제 운영 시에는 users 테이블을 별도로 만들어 이메일 저장 권장)

  // 통계
  const paidOrders = orders.filter(o => o.status === 'paid');
  const totalRevenue = paidOrders.reduce((s, o) => s + o.amount, 0);
  const today = new Date().toDateString();
  const todayOrders = orders.filter(o => new Date(o.created_at).toDateString() === today).length;

  document.getElementById('statOrders').textContent = orders.length;
  document.getElementById('statRevenue').textContent = fmt(totalRevenue);
  document.getElementById('statToday').textContent = todayOrders;
  document.getElementById('lastUpdated').textContent =
    '마지막 업데이트: ' + fmtDate(new Date().toISOString());

  if (orders.length === 0) {
    wrap.innerHTML = '<div style="padding:60px;text-align:center;color:var(--muted);">아직 주문이 없습니다.</div>';
    return;
  }

  const rows = orders.map(o => {
    const items = (o.order_items || [])
      .map(i => `${i.products?.image_emoji || '🎁'}${i.products?.name || '상품'} ×${i.quantity}`)
      .join(', ');
    const badge = o.status === 'paid'
      ? '<span class="badge badge-paid">결제완료</span>'
      : '<span class="badge badge-failed">실패</span>';
    const shortId = o.toss_order_id ? o.toss_order_id.slice(-8) : o.id.slice(-8);
    return `<tr>
      <td><div style="font-size:.75rem;color:var(--muted);">...${shortId}</div></td>
      <td style="font-size:.75rem;color:var(--muted);">${fmtDate(o.created_at)}</td>
      <td><div class="items-list">${items || '-'}</div></td>
      <td class="amt">${fmt(o.amount)}</td>
      <td>${badge}</td>
    </tr>`;
  }).join('');

  wrap.innerHTML = `
    <table>
      <thead><tr>
        <th>주문 ID</th>
        <th>주문 일시</th>
        <th>상품</th>
        <th>금액</th>
        <th>상태</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
})();
</script>
</body>
</html>
